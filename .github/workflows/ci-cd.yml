name: CI/CD Task Manager

on:
  push:
    branches:
      - main
      - dev_atividadeAvaliativa
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Testes da aplicação
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d task_manager"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Inicializar banco de dados
        run: node init-db.js
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: task_manager
          DATABASE_USER: admin
          DATABASE_PASSWORD: admin

      - name: Iniciar aplicação
        run: npm run dev > app.log 2>&1 &
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: task_manager
          DATABASE_USER: admin
          DATABASE_PASSWORD: admin

      - name: Aguardar aplicação iniciar
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log || true
          exit 1

      - name: Executar testes
        run: npm test
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: task_manager
          DATABASE_USER: admin
          DATABASE_PASSWORD: admin

      - name: Publicar logs da aplicação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: app.log
          if-no-files-found: ignore

  docker:
    name: Build e publicação da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Login no Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
