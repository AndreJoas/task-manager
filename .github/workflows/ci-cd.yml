name: CI/CD Task Manager

on:
  push:
    branches:
      - main
      - dev_atividadeAvaliativa

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Testes da aplicação
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d task_manager"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install

      - name: Verificar PostgreSQL
        run: |
          pg_isready -h localhost -p 5432 -U admin -d task_manager

      - name: Iniciar aplicação
        run: |
          npm run dev > app.log 2>&1 &
          echo $! > app.pid
          sleep 5
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: task_manager
          DATABASE_USER: admin
          DATABASE_PASSWORD: admin

      - name: Verificar processo da aplicação
        run: |
          echo "===== PROCESSOS NODE ====="
          ps aux | grep node || true

          echo "===== LOG INICIAL ====="
          cat app.log || true

      - name: Aguardar aplicação iniciar
        run: |
          for i in {1..30}; do
            echo "Tentativa $i/30"

            if curl -f -s http://localhost:3000/api/health; then
              echo ""
              echo "✅ Aplicação está disponível!"
              exit 0
            fi

            sleep 2
          done

          echo ""
          echo "❌ A aplicação não iniciou."

          echo "===== PROCESSOS ====="
          ps aux | grep node || true

          echo "===== LOG DA APLICAÇÃO ====="
          cat app.log || true

          echo "===== PORTA 3000 ====="
          ss -lntp | grep 3000 || true

          exit 1

      - name: Verificar endpoint de saúde
        run: |
          curl -f http://localhost:3000/api/health

      - name: Executar testes
        run: npm test
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: task_manager
          DATABASE_USER: admin
          DATABASE_PASSWORD: admin

      - name: Exibir logs em caso de falha
        if: failure()
        run: |
          echo "===== LOG FINAL DA APLICAÇÃO ====="
          cat app.log || true

          echo "===== PROCESSOS NODE ====="
          ps aux | grep node || true

          echo "===== PORTAS ====="
          ss -lntp || true

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager:latest

